<title>Parler avec Anna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : grille AAC mobile — catégories à gauche, grandes cases à droite, barre Non · Parler · Oui fixe */
:root{
  --bg:#EEF2F1; --panel:#FFFFFF; --panel-2:#E3EAE8; --ink:#13211F; --muted:#566865; --line:#CFD9D6;
  --accent:#0F5E63; --accent-ink:#FFFFFF; --yes:#1E7A4C; --no:#B2412E; --talk:#B87A08; --urgent:#B3261E; --priv:#5A4C8C;
  --tl:36%; --tint:13%;
  --f:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:16px; --rail:88px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0D1615; --panel:#15201F; --panel-2:#1C2A28; --ink:#E5EEEC; --muted:#93A6A2; --line:#2A3B38;
  --accent:#4FB0AC; --accent-ink:#06201F; --yes:#3E9E6D; --no:#C9604C; --talk:#E6B043; --urgent:#F0675C; --priv:#A497E0;
  --tl:68%; --tint:16%; color-scheme:dark}}
@media (min-width:720px){:root{--rail:176px}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4;overscroll-behavior:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:1180px;margin:0 auto;padding:env(safe-area-inset-top,0px) 16px 0}
.muted{color:var(--muted)}

/* barre du haut */
.top{display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.who{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0;overflow:hidden}
.who b{font-size:22px}
.who .clock{font-family:var(--mono);color:var(--muted);font-size:13px;white-space:nowrap}
@media (max-width:430px){.who .clock{display:none}}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;min-width:42px;padding:0 11px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.ib svg{font-size:20px}
.ib.on{border-color:var(--accent);color:var(--accent)}
.ib.nav-b{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ib .lb{display:none}
@media (min-width:720px){.ib .lb{display:inline}}
.sync{font-size:12px;color:var(--talk);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--no)}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:default}

/* zone centrale */
.main{overflow:auto;min-height:0;padding-block:12px}
.main.board-mode{overflow:hidden}

/* grille : colonne de catégories + cases */
.board{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:12px;height:100%;min-height:0}
.rail{display:flex;flex-direction:column;gap:6px;overflow-y:auto;padding-right:2px;min-height:0}
.rb{--tc:hsl(var(--h) 48% var(--tl));flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:14px;border:2px solid transparent;background:transparent;font-size:12.5px;font-weight:700;text-align:center;line-height:1.15}
.rb svg{font-size:28px;color:var(--tc)}
.rb:hover{background:var(--panel)}
.rb.cur{background:color-mix(in srgb,var(--tc) var(--tint),var(--panel));border-color:var(--tc)}
@media (min-width:720px){.rb{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;font-size:16px;text-align:left}.rb svg{font-size:26px}}
.gridwrap{overflow-y:auto;min-width:0;min-height:0;padding-bottom:8px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 0 10px}
.ghead h2{margin:0;font-size:20px}
.ghead span{font-size:13px;color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.cells{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.cells{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cell{--tc:hsl(var(--h) 48% var(--tl));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:124px;padding:12px 8px;border-radius:var(--r);border:2px solid color-mix(in srgb,var(--tc) 35%,var(--line));background:color-mix(in srgb,var(--tc) var(--tint),var(--panel));text-align:center;transition:transform .12s,border-color .12s}
.cell:hover{border-color:var(--tc)}
.cell:active{transform:scale(.97)}
.cell>svg{font-size:44px;color:var(--tc)}
.cell b{font-size:17px;line-height:1.15}
.cell small{font-size:12.5px;color:var(--muted);line-height:1.2}
.cell .av{width:52px;height:52px;font-size:19px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff;flex:none}
.empty{padding:24px;border:2px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

/* questions */
.qv{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.crumbs .c{padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.crumbs .lockb{color:var(--priv);border-color:var(--priv)}
.q{font-size:clamp(30px,7vw,60px);line-height:1.12;font-weight:700;margin:0;text-wrap:balance}
.qmeta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.pill.ok{color:var(--yes);border-color:var(--yes)}.pill.ko{color:var(--no);border-color:var(--no)}.pill.u{color:var(--urgent);border-color:var(--urgent)}.pill.t{color:var(--talk);border-color:var(--talk)}
.done{display:grid;grid-template-columns:1fr;gap:14px;max-width:1100px;margin:0 auto}
@media (min-width:900px){.done{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.result{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.result.urgent{border:2px solid var(--urgent)}
.tag{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.big{font-size:clamp(26px,5vw,44px);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
.big.ask{font-size:clamp(32px,7vw,60px)}
.urg{color:var(--urgent);font-weight:700;margin:0}
.notes{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.notes li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;background:var(--bg);font-size:15px}
.ans-y{color:var(--yes);font-weight:700}.ans-n{color:var(--no);font-weight:700}
.next{font-size:clamp(21px,4vw,28px);font-weight:700;margin:4px 0 0}
.deeper{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.deeper h3{margin:0 0 4px;font-size:16px;display:flex;gap:8px;align-items:center}
.deeper p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.dlist{display:flex;flex-direction:column;gap:6px}
.dlist button{text-align:left;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.dlist button:hover{border-color:var(--accent)}
.dlist button.asked{opacity:.5}
.plist{list-style:none;margin:0;padding:0;font-size:17px;display:flex;flex-direction:column;gap:4px}
.plist time{font-family:var(--mono);font-size:14px;color:var(--muted);margin-right:8px}

/* épellation */
.spell{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.typed{font-family:var(--mono);font-size:clamp(26px,6vw,46px);min-height:1.6em;padding:10px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);word-break:break-word}
.caret{display:inline-block;width:.55ch;background:var(--accent);animation:blink 1s steps(2) infinite;height:1em;vertical-align:-.12em}
@keyframes blink{50%{opacity:0}}
.lg{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border-radius:12px;border:2px solid transparent}
.lg.cur{border-color:var(--talk);background:color-mix(in srgb,var(--talk) 10%,transparent)}
.lg button{min-width:44px;height:46px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:20px;font-weight:700}
.lg button.cur{background:var(--talk);color:#1b1300;border-color:var(--talk)}
.lg button.act{font-size:13px}

/* barre de réponse */
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ans{height:clamp(68px,10vh,100px);border-radius:18px;border:none;font-size:clamp(24px,5vw,38px);font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;padding:0 6px;min-width:0;transition:transform .1s,filter .15s}
.ans:active,.ans.flash{transform:scale(.97);filter:brightness(1.15)}
.ans.flash{outline:4px solid var(--ink);outline-offset:3px}
.ans.no{background:var(--no)}.ans.yes{background:var(--yes)}
.ans.talk{background:var(--talk);color:#1b1300;font-size:15px;padding:0 12px;min-width:84px;flex-direction:column;gap:2px}
.ans.talk svg{font-size:28px}
.ans .long{display:none}
@media (min-width:600px){.ans .long{display:inline}.ans .short{display:none}.ans.talk{min-width:150px;font-size:18px}}

/* caméra */
.cam{position:fixed;right:16px;top:calc(64px + env(safe-area-inset-top,0px));width:132px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5}
@media (min-width:720px){.cam{width:190px;top:auto;bottom:calc(130px + env(safe-area-inset-bottom,0px))}}
.cam video{width:100%;display:block;transform:scaleX(-1);aspect-ratio:4/3;object-fit:cover;background:#000}
.cam .st{padding:6px 8px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.meter{display:grid;grid-template-columns:36px 1fr;gap:6px;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.meter i{height:5px;border-radius:3px;background:var(--panel-2);position:relative;overflow:hidden}
.meter i b{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}

/* fenêtres + messages */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:20;padding:16px}
.ovc{background:var(--panel);border:3px solid var(--talk);border-radius:20px;padding:22px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px}
.ovc.lock{border-color:var(--accent)}
.ovc h2{margin:0;font-size:clamp(26px,6vw,36px);display:flex;gap:10px;align-items:center}
.ovc .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ovc .row .btn{justify-content:center;padding:14px 10px;font-size:16px}
.ovc .err{color:var(--no);font-weight:700;margin:0;min-height:1.2em}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:15px;max-width:calc(100% - 32px)}
.setup{max-width:520px;margin:10vh auto 0;display:flex;flex-direction:column;gap:14px}
.setup h1{margin:0;font-size:28px}

/* espace soignant */
.adm{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--panel-2);position:sticky;top:0;z-index:2}
.seg button{padding:10px 6px;border:none;border-radius:10px;background:transparent;font-size:15px;color:var(--muted);font-weight:700}
.seg button.cur{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .n{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;display:block}
.stat .l{font-size:13px;color:var(--muted)}
.stat.warn{border-color:var(--urgent)}.stat.warn .n{color:var(--urgent)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:none}
.rows .t{flex:1;min-width:0;overflow-wrap:anywhere}
.rows .t small{display:block;color:var(--muted);font-size:13px}
.rows time{font-family:var(--mono);font-size:12.5px;color:var(--muted);width:64px;flex:none;align-self:flex-start;padding-top:2px}
.rows .l1{padding-left:20px}.rows .l2{padding-left:40px}
.sbar{width:64px;height:7px;background:var(--panel-2);border-radius:4px;position:relative;flex:none}
.sbar b{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;white-space:nowrap}
.chips button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fgrid{display:grid;gap:10px}
@media (min-width:640px){.fgrid.c2{grid-template-columns:1fr 1fr}}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=search],input[type=password],select,textarea{font:inherit;font-size:16px;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{font-family:var(--mono);font-size:14px;min-height:170px}
.ck{display:flex;gap:8px;align-items:center;font-size:15px}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
summary{cursor:pointer;font-weight:700;font-size:15px;padding:4px 0;color:var(--accent)}
details[open] summary{margin-bottom:10px}
code.key{display:block;font-family:var(--mono);font-size:13px;padding:10px;border-radius:8px;background:var(--bg);overflow-wrap:anywhere;user-select:all}
/* grille v2 : thèmes à gauche (titres de catégorie sur grand écran), pictogrammes à droite */
.rh{display:none;margin:12px 6px 2px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
@media (min-width:720px){.rh{display:block}}
.ghead{flex-wrap:wrap}
.ghead h2{display:flex;align-items:center;gap:8px}
.ghead h2 svg{font-size:24px;color:var(--accent)}
.ghead.sub{margin-top:18px}
.ghead.sub h3{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lockn{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--priv)}
.cell.urg{border-color:var(--urgent)}
.rows li>svg{font-size:22px;color:var(--accent)}
.card h3{display:flex;align-items:center;gap:8px}
.card h3 svg{font-size:20px;color:var(--accent)}
/* accueil téléphone : une ligne par thème (thème + 3 pictogrammes + « + »), en pages */
.page{height:100%;display:flex;flex-direction:column;gap:8px;min-height:0}
.prows{flex:1;display:grid;gap:6px;min-height:0}
.trow{--tc:hsl(var(--h) 48% var(--tl));display:grid;grid-template-columns:minmax(72px,1.1fr) repeat(4,minmax(0,1fr));gap:5px;padding:5px;min-height:0;border-radius:14px;border:1px solid color-mix(in srgb,var(--tc) 30%,var(--line));background:color-mix(in srgb,var(--tc) var(--tint),var(--panel))}
.tlab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;border:none;border-radius:10px;background:transparent;font-size:14.5px;font-weight:700;line-height:1.1;text-align:center;min-height:0}
button.tlab:hover{background:var(--panel)}
.tlab svg{font-size:30px;color:var(--tc)}
.pic{--tc:hsl(var(--h) 48% var(--tl));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 3px;min-width:0;min-height:0;border-radius:11px;border:1.5px solid color-mix(in srgb,var(--tc) 30%,var(--line));background:var(--panel);font-size:14px;font-weight:700;line-height:1.12;color:var(--ink);text-align:center;overflow:hidden}
.pic span,.tlab span{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.pic:hover{border-color:var(--tc)}
.pic:active{transform:scale(.96)}
.pic>svg{font-size:32px;color:var(--tc);flex:none}
.pic .av{width:30px;height:30px;font-size:14px}
.pic.urg{border-color:var(--urgent)}
.pic.hot{border-width:2px;border-color:var(--tc)}
.pic.more{background:transparent;border-style:dashed}
.pic .plus{font-size:20px;color:var(--tc)}
@media (min-width:720px){.tlab{font-size:17px}.tlab svg,.pic>svg{font-size:38px}.pic{font-size:16px}}
.pager{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pager span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pager .btn{justify-content:center;padding:12px 10px;font-size:15px}
.pager .btn:last-child{justify-self:end}
.phead{--tc:hsl(var(--h) 48% var(--tl));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phead h2{margin:0;font-size:20px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.phead h2 svg{color:var(--tc);font-size:26px}
.pgrid{flex:1;display:grid;gap:8px;min-height:0}
.pgrid .pic{font-size:15px}
.pgrid .pic>svg{font-size:40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-douleur" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></symbol>
  <symbol id="i-soif" viewBox="0 0 24 24"><path d="M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5V8z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 2.5v3M12 2.5v3"/></symbol>
  <symbol id="i-hygiene" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/></symbol>
  <symbol id="i-position" viewBox="0 0 24 24"><path d="M3 18V6M3 14h18v4M21 14v-1a3 3 0 0 0-3-3h-7v4"/><circle cx="7" cy="11" r="2"/></symbol>

<script type="module">
// ---- lib/content.js
// Conversions pures entre la banque de questions en base (lignes SQL) et l'arbre envoyé au front.
// Sans dépendance à la base : testable seul et partagé par l'API, le seed et le serveur de dev.

const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '')
  .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

const PEOPLE_KINDS = ['Proches', 'Équipe', 'Rencontres'];

/** Aplati le contenu par défaut (lib/defaults.js) en lignes prêtes à insérer. */
function flattenDefaults(types, themes) {
  const rows = { types: [], themes: [], questions: [], followups: [] };
  types.forEach((t, i) => rows.types.push({ id: t.id, name: t.name, short_label: t.short, icon: t.icon, hue: t.h, position: i }));
  themes.forEach((t, i) => {
    rows.themes.push({ id: t.id, type_id: t.type, label: t.label, subtitle: t.sub || '', icon: t.icon || 'autre',
      is_private: !!t.private, people_kinds: t.peopleKinds || null, position: i });
    const walk = (items, parentId, prefix) => (items || []).forEach((it, j) => {
      const id = prefix + '.' + slug(it.l);
      rows.questions.push({
        id, theme_id: t.id, parent_id: parentId, label: it.l, text: it.q,
        kind: it.ask ? (it.say ? 'say' : 'ask') : 'question', ask_text: it.ask || null,
        action: it.action || null, is_urgent: !!it.urgent, is_private: !!it.private,
        has_intensity: it.then === '@i', position: j,
      });
      if (Array.isArray(it.then)) walk(it.then, id, id);
    });
    walk(t.items, null, t.id);
    (t.deeper || []).forEach((text, j) => rows.followups.push({ theme_id: t.id, text, position: j }));
  });
  return rows;
}

/** Construit la charge utile du front à partir des lignes lues en base. */
function buildBootstrap({ patient, types, themes, questions, followups, people, stats, history, isAdmin }) {
  const byParent = new Map();
  for (const q of questions) {
    const k = q.parent_id || '§' + q.theme_id;
    if (!byParent.has(k)) byParent.set(k, []);
    byParent.get(k).push(q);
  }
  const toItem = q => {
    const children = byParent.get(q.id);
    const it = { id: q.id, l: q.label, q: q.text };
    if (q.has_intensity) it.then = '@i';
    else if (children?.length) it.then = children.map(toItem);
    if (q.is_urgent) it.urgent = true;
    if (q.is_private) it.private = true;
    if (q.action) it.action = q.action;
    if (q.kind === 'ask' || q.kind === 'say') { it.ask = q.ask_text; if (q.kind === 'say') it.say = true; }
    return it;
  };
  const deeperBy = new Map();
  for (const f of followups) {
    if (!deeperBy.has(f.theme_id)) deeperBy.set(f.theme_id, []);
    deeperBy.get(f.theme_id).push({ id: String(f.id), text: f.text });
  }
  const statMap = {};
  for (const s of stats) statMap[s.question_key] = { a: +s.asked, y: +s.yes, n: +s.no, p: +s.talk, rt: +s.rt_sum };

  return {
    patientName: patient.display_name,
    plan: patient.daily_plan || '',
    settings: { reco: patient.settings?.reco !== false, sens: Number(patient.settings?.sens) || 1, swap: !!patient.settings?.swap },
    hasPin: !!patient.admin_pin_hash,
    isAdmin: !!isAdmin,
    types: types.map(t => ({ id: t.id, name: t.name, short: t.short_label, icon: t.icon, h: t.hue })),
    themes: themes.map(t => ({
      id: t.id, label: t.label, group: t.type_id, sub: t.subtitle, icon: t.icon,
      private: t.is_private, dynamic: !!t.people_kinds, peopleKinds: t.people_kinds || [],
      items: (byParent.get('§' + t.id) || []).map(toItem),
      deeper: deeperBy.get(t.id) || [],
    })),
    people: people.map(p => ({ id: p.id, name: p.name, role: p.role, kind: p.kind })),
    stats: statMap,
    history: history.map(h => ({
      id: h.id, ts: new Date(h.created_at).getTime(), theme: h.theme_id, path: h.path, result: h.result,
      n: h.questions_count, dur: h.duration_ms, urgent: h.is_urgent, notes: h.notes || [],
    })),
  };
}

// ---- lib/defaults.js

// (et, dans le navigateur, dans localStorage). Sert au serveur local (scripts/dev-mock.mjs)

class DemoError extends Error { constructor(status, message) { super(message); this.status = status; } }
const sfx = () => Math.random().toString(16).slice(2, 8);
const uuid = () => (globalThis.crypto?.randomUUID?.() || `${sfx()}${sfx()}-0000-4000-8000-${sfx()}${sfx()}`);

/** Historique et statistiques d'exemple, datés par rapport à maintenant, pour que la démo ne soit pas vide. */
function exampleData(questions) {
  const now = Date.now(), H = 3600e3;
  const h = (off, theme, path, extra = {}) => ({ id: uuid(), theme_id: theme, path, result: 'resolu', questions_count: path.length + 1,
    duration_ms: 15000 + Math.round(off * 900 % 40000), is_urgent: false, created_at: new Date(now - off * H).toISOString(), notes: [], ...extra });
  const history = [
    h(0.4, 'soif', ['Boire / manger', 'Boire', 'Eau']),
    h(1.6, 'position', ['Position', 'Changer de position', 'Côté gauche']),
    h(2.9, 'douleur', ['Douleur', 'Dos', 'Moyenne'], { notes: [['Changer de position pourrait soulager ?', 'oui']] }),
    h(4.2, 'proches', ['Proches', 'Léa', 'Voir']),
    h(5.1, 'hygiene', ['Toilette', 'Aspiration']),
    h(6.3, 'emotions', ['Émotions', 'Fatigue'], { notes: [['Tu as bien dormi ?', 'non']] }),
    h(20.5, 'douleur', ['Douleur', 'Dos', 'Forte'], { notes: [['Tu veux un antidouleur ?', 'oui']] }),
    h(22.1, 'soif', ['Boire / manger', 'Boire', 'Eau']),
    h(23.4, 'activites', ['Loisirs', 'Atelier', 'Musique'], { notes: [['Tu as aimé cette activité ?', 'oui']] }),
    h(25.2, 'passerelle', ['La Passerelle', 'Voir un soignant', 'Kiné']),
    h(26.4, 'position', ['Position', 'Remonter']),
    h(27.0, 'autre', ['Autre sujet', 'Souvenirs', 'Voyage'], { notes: [['C’est un souvenir heureux ?', 'oui']] }),
    h(29.8, 'emotions', ['Émotions', 'Inquiétude', 'Mes proches']),
    h(30.5, 'personnes', ['Personnes', 'Paul', 'Bon moment']),
    h(43.7, 'soif', ['Boire / manger', 'Boire', 'Boisson chaude']),
    h(45.9, 'douleur', ['Douleur', 'Jambes / pieds', 'Légère']),
    h(47.2, 'proches', ['Proches', 'Claire', 'Appeler']),
    h(47.9, 'parler', ['Message', 'LUNETTES'], { result: 'message' }),
  ];
  let s = 7; const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  const base = {};
  for (const q of questions) {
    const a = 3 + Math.floor(rnd() * 26), y = Math.floor(a * (0.08 + rnd() * 0.5));
    base[q.id] = { asked: a, yes: y, no: a - y, talk: 0, rt_sum: a * (1400 + Math.floor(rnd() * 4200)) };
  }
  Object.assign(base, {
    'douleur.dos': { asked: 31, yes: 19, no: 12, talk: 0, rt_sum: 31 * 1900 },
    'soif.boire': { asked: 40, yes: 29, no: 11, talk: 0, rt_sum: 40 * 1500 },
    'soif.boire.eau': { asked: 29, yes: 21, no: 8, talk: 0, rt_sum: 29 * 1300 },
    'hygiene.aspiration': { asked: 22, yes: 14, no: 8, talk: 0, rt_sum: 22 * 1600 },
    'position.changer-de-position': { asked: 27, yes: 17, no: 10, talk: 0, rt_sum: 27 * 2100 },
    'interaction.ca-va': { asked: 34, yes: 26, no: 8, talk: 0, rt_sum: 34 * 1200 },
  });
  return { history, base };
}

function freshDb(withExamples) {
  const rows = flattenDefaults(TYPES, THEMES);
  const ex = withExamples ? exampleData(rows.questions) : { history: [], base: {} };
  return {
    v: 3,
    patient: { id: 'demo', display_name: 'Anna', admin_pin: null, daily_plan: DEFAULT_PLAN, settings: { reco: true, sens: 1 } },
    types: rows.types, themes: rows.themes, questions: rows.questions,
    followups: rows.followups.map((f, i) => ({ ...f, id: i + 1 })),
    people: DEMO_PEOPLE.map((p, i) => ({ ...p, id: slug(p.name), position: i })),
    baseStats: ex.base, events: [], conversations: ex.history, nextId: 1000,
  };
}

function createDemoBackend({ load = () => null, save = () => {}, withExamples = true } = {}) {
  let db = load();
  if (!db || db.v !== 3) db = freshDb(withExamples);
  let session = false;
  let deviceKey = 'demo';
  const persist = () => save(db);

  function stats() {
    const m = new Map(Object.entries(db.baseStats).map(([k, v]) => [k, { question_key: k, ...v }]));
    for (const e of db.events) {
      const s = m.get(e.key) || { question_key: e.key, asked: 0, yes: 0, no: 0, talk: 0, rt_sum: 0 };
      if (e.answer === 'parler') s.talk++; else { s.asked++; s[e.answer === 'oui' ? 'yes' : 'no']++; s.rt_sum += e.ms; }
      m.set(e.key, s);
    }
    return [...m.values()];
  }
  const privateTheme = id => db.themes.find(t => t.id === id)?.is_private;
  const privateKey = key => db.questions.some(q => q.is_private && (key === q.id || key.startsWith(q.id + '.')));
  const need = (v, msg = 'Champ manquant') => { if (!String(v ?? '').trim()) throw new DemoError(400, msg); return String(v).trim(); };
  const byPos = list => [...list].sort((a, b) => (a.position ?? 0) - (b.position ?? 0));

  const routes = {
    'GET data/bootstrap': () => buildBootstrap({
      patient: { ...db.patient, admin_pin_hash: db.patient.admin_pin }, isAdmin: session,
      types: byPos(db.types), themes: byPos(db.themes), questions: byPos(db.questions), followups: byPos(db.followups),
      people: byPos(db.people), stats: stats(),
      history: [...db.conversations].sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, 400),
    }),
    'POST data/events': b => {
      const evs = (b.events || []).filter(e => !privateTheme(e.theme) && !privateKey(e.key));
      db.events.push(...evs); return { saved: evs.length };
    },
    'POST data/conversation': b => {
      if (privateTheme(b.theme) || db.conversations.some(c => c.id === b.id)) return { saved: 0 };
      db.conversations.push({ id: b.id, theme_id: b.theme, path: b.path, result: b.result, questions_count: b.n || 0, duration_ms: b.dur || 0,
        is_urgent: !!b.urgent, created_at: new Date(b.at || Date.now()).toISOString(), notes: [] });
      return { saved: 1 };
    },
    'POST data/note': b => {
      const c = db.conversations.find(x => x.id === b.conversationId); if (!c) return { saved: 0 };
      c.notes.push([b.question, b.answer]); return { saved: 1 };
    },
    'GET auth/status': () => ({ hasPin: !!db.patient.admin_pin, isAdmin: session }),
    'POST auth/setup': b => {
      if (db.patient.admin_pin) throw new DemoError(409, 'Un code existe déjà');
      if ((b.pin || '').length < 4) throw new DemoError(400, 'Au moins 4 caractères');
      db.patient.admin_pin = b.pin; session = true; return { ok: true };
    },
    'POST auth/login': b => { if (b.pin !== db.patient.admin_pin) throw new DemoError(401, 'Code incorrect'); session = true; return { ok: true }; },
    'POST auth/logout': () => { session = false; return { ok: true }; },
  };

  const admin = {
    'add-question': b => {
      const themeId = need(b.themeId), label = need(b.label, 'Mot-clé manquant'), raw = need(b.text, 'Texte manquant');
      if (!db.themes.some(t => t.id === themeId)) throw new DemoError(404, 'Thème introuvable');
      const parentId = b.parentId || null, kind = ['ask', 'say'].includes(b.kind) ? b.kind : 'question';
      const id = `${parentId || themeId}.${slug(label) || 'q'}-${sfx()}`;
      const siblings = db.questions.filter(q => q.theme_id === themeId && (q.parent_id || null) === parentId);
      db.questions.push({ id, theme_id: themeId, parent_id: parentId, label,
        text: kind === 'ask' ? `Demander : « ${raw} »` : kind === 'say' ? `Dire : « ${raw} »` : raw,

    'change-pin': b => { if ((b.pin || '').length < 4) throw new DemoError(400, 'Au moins 4 caractères'); db.patient.admin_pin = b.pin; },
    'rotate-device-key': () => { deviceKey = sfx() + sfx(); return { key: deviceKey }; },
  };

  /** Même contrat que fetch('/api/…') : renvoie les données ou lève une erreur portant .status. */
  async function request(method, path, body = {}, { key = deviceKey } = {}) {
    const url = new URL(path, 'http://demo');
    const fn = url.pathname.replace(/^\/api\//, ''), action = url.searchParams.get('action');
    if (key !== deviceKey) throw new DemoError(401, 'Appareil non reconnu');
    let out;
    if (fn === 'admin') {
      if (!session) throw new DemoError(403, 'Session soignant requise');
      if (method !== 'POST' || !admin[action]) throw new DemoError(404, 'Action inconnue');
      out = { ok: true, ...(admin[action](body || {}) || {}) };
    } else {
      const route = routes[`${method} ${fn}/${action}`];
      if (!route) throw new DemoError(404, 'Action inconnue');
      out = route(body || {});
    }
    if (method === 'POST') persist();
    return JSON.parse(JSON.stringify(out));
  }

  return { request, reset: () => { db = freshDb(withExamples); session = false; persist(); } };
}

// ---- public/head-tracking.js
// Suivi des mouvements de tête avec MediaPipe Face Landmarker (Tasks Vision), 100 % dans le navigateur :
// les images de la caméra ne quittent jamais l'appareil, seuls les gestes (oui / non / parler) sont émis.
//   tête tournée vers SA gauche = oui · vers SA droite = non · pencher la tête 1 s = je veux parler
// (getSwap() inverse gauche et droite si la caméra de l'appareil renvoie une image miroir)

const VISION = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

function createHeadTracker({ video, onGesture, onMeters, onStatus, getSensitivity, getSwap = () => false }) {
  let landmarker = null, stream = null, running = false, raf = 0, lastTime = -1;
  const st = { base: null, calib: [], exc: null, cool: 0, rollT: 0 };

  async function load() {
    if (landmarker) return;
    onStatus('Chargement du modèle…');
    const { FaceLandmarker, FilesetResolver } = await import(`${VISION}/vision_bundle.mjs`);
    const files = await FilesetResolver.forVisionTasks(`${VISION}/wasm`);
    const opts = delegate => ({ baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: 'VIDEO', numFaces: 1 });
    try { landmarker = await FaceLandmarker.createFromOptions(files, opts('GPU')); }
    catch { landmarker = await FaceLandmarker.createFromOptions(files, opts('CPU')); }
  }

  async function start() {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    video.srcObject = stream;
    await video.play();
    await load();
    recalibrate();
    running = true;
    loop();
  }

  function stop() {
    running = false;
    cancelAnimationFrame(raf);
    stream?.getTracks().forEach(t => t.stop());
    stream = null;
    video.srcObject = null;
  }

  function recalibrate() {
    Object.assign(st, { base: null, calib: [], exc: null, rollT: 0 });
    onStatus('Calibration : tête immobile…');
  }

  function loop() {
    if (!running) return;
    if (video.readyState >= 2 && video.currentTime !== lastTime) {
      lastTime = video.currentTime;
      const res = landmarker.detectForVideo(video, performance.now());
      track(res.faceLandmarks?.[0], (video.videoWidth || 4) / (video.videoHeight || 3));
    }
    raf = requestAnimationFrame(loop);
  }

  // Orientation de la tête à partir du nez et des coins des yeux, normalisée par l'écart entre les yeux
  // et corrigée de l'inclinaison (roll) pour que pencher la tête ne soit pas lu comme oui ou non.
  function track(lm, aspect) {
    if (!lm) { onStatus('Visage non détecté'); return; }
    const n = lm[1], L = lm[33], R = lm[263];
    const lx = L.x * aspect, rx = R.x * aspect, nx = n.x * aspect;
    const eye = Math.hypot(rx - lx, R.y - L.y), mx = (lx + rx) / 2, my = (L.y + R.y) / 2;
    const roll = Math.atan2(R.y - L.y, rx - lx), c = Math.cos(-roll), s = Math.sin(-roll);
    const vx = nx - mx, vy = n.y - my;
    const yaw = (vx * c - vy * s) / eye, pitch = (vx * s + vy * c) / eye;

    if (!st.base) {
      st.calib.push([yaw, pitch, roll]);
      if (st.calib.length >= 25) {
        const m = i => st.calib.reduce((a, v) => a + v[i], 0) / st.calib.length;
        st.base = { y: m(0), p: m(1), r: m(2) };
        onStatus('Prêt');
      }
      return;
    }
    const k = getSensitivity(), kP = 0.12 * k, kY = 0.16 * k, kR = 0.26 * k;
    const dp = pitch - st.base.p, dy = yaw - st.base.y, dr = roll - st.base.r, now = performance.now();
    // Dans l'image brute de la caméra, le nez part vers la droite de l'image quand Anna tourne vers SA gauche.
    const left = getSwap() ? -dy : dy;
    onMeters(Math.max(0, left) / kY, Math.max(0, -left) / kY, Math.abs(dr) / kR);
    if (now < st.cool) { st.exc = null; return; }

    // Pencher la tête et tenir 1 seconde = je veux parler
    if (Math.abs(dr) > kR) {
      if (!st.rollT) st.rollT = now;
      if (now - st.rollT > 1000) { fire('parler'); st.rollT = 0; st.cool = now + 2000; }
      return;
    }
    st.rollT = 0;

    // Un geste = tourner la tête au-delà du seuil puis revenir au repos en moins de 1,6 s.
    // Le sens de la rotation la plus forte décide : vers sa gauche = oui, vers sa droite = non.
    // Un mouvement surtout vertical (hocher, baisser la tête) n'est pas un geste.
    if (!st.exc) {
      if (Math.abs(dy) > kY) st.exc = { t: now, py: 0, pp: 0, peak: 0 };
      else if (Math.abs(dp) < kP * 0.3 && Math.abs(dy) < kY * 0.3) {
        // Au repos : la position de référence suit lentement les petits glissements.
        st.base.p += 0.02 * dp; st.base.y += 0.02 * dy; st.base.r += 0.02 * dr;
      }
    }
    if (st.exc) {
      const e = st.exc;
      if (Math.abs(left) > Math.abs(e.peak)) e.peak = left;
      e.py = Math.max(e.py, Math.abs(dy) / kY); e.pp = Math.max(e.pp, Math.abs(dp) / kP);
      if (now - e.t > 1600) { st.exc = null; if (now - e.t > 4000) recalibrate(); }
      else if (Math.abs(dy) < kY * 0.45) {
        st.exc = null;
        if (e.py > e.pp * 1.15) { fire(e.peak > 0 ? 'oui' : 'non'); st.cool = now + 1200; }
      }
    }
  }

  const fire = g => onGesture(g);

  return { start, stop, recalibrate, get running() { return running; } };
}

    const k = e.theme + '|' + e.path.join('|'), dh = Math.abs(new Date(e.ts).getHours() - hr);

    const m = map.get(k) || { theme: e.theme, path: e.path, w: 0 }; m.w += w; map.set(k, m);
  });

}
// Top 3 : les besoins habituels à cette heure, complétés par les questions au meilleur score.
function top3() {
  const out = suggestions().slice(0, 3).map(sg => ({ kind: 'sugg', sg }));
  if (out.length < 3) {
    const cands = [];
    S.themes.filter(t => !t.private && !t.dynamic).forEach(t => t.items.forEach(it => { if (!it.action) cands.push({ t, it, s: scoreOf(it.id).score }); }));
    cands.sort((a, b) => b.s - a.s);
    for (const c of cands) {
      if (out.length >= 3) break;
      if (out.some(o => o.kind === 'sugg' ? o.sg.theme === c.t.id && o.sg.path[1] === c.it.l : o.it.id === c.it.id)) continue;
      out.push({ kind: 'item', t: c.t, it: c.it });
    }
  }
  return out;
}

/* ================================================================ déroulé des questions */
const cur = () => { const top = F.stack[F.stack.length - 1]; return top.list[top.idx]; };
function goHome() { F = { mode: 'home' }; undo = []; render(); }
function startTheme(id, pre) {
  const t = theme(id); if (!t) return;
  const list = themeItems(t);
  if (!list.length) { toast(`« ${t.label} » n’a pas encore de questions : ajoute-les dans l’espace admin.`); return goHome(); }
  F = { mode: 'q', theme: id, stack: [{ list, idx: 0 }], path: [t.label], asked: [], t0: Date.now(), priv: !!t.private, urgent: false };
  undo = [];
  if (pre) { const it = F.stack[0].list.find(x => x.id === pre); if (it) { F.path.push(it.l); F.stack.push({ list: ordered(it.then), idx: 0 }); } }
  showQ();
}
// Toucher un pictogramme : on pose directement cette question (non → retour à la grille).
function startItem(themeId, itemId) {
  const t = theme(themeId); if (!t) return;
  const it = themeItems(t).find(x => x.id === itemId); if (!it) return;
  F = { mode: 'q', theme: themeId, stack: [{ list: [it], idx: 0 }], path: [t.label], asked: [], t0: Date.now(), priv: !!t.private || !!it.private, urgent: false, single: true };
  undo = []; showQ();
}
function startScan() {
  const list = S.themes.filter(t => themeItems(t).length).map(t => ({ t, u: S.history.filter(e => e.theme === t.id).length })).sort((a, b) => b.u - a.u)
    .map(({ t }) => ({ id: 'scan.' + t.id, l: t.label, q: `C’est à propos de : ${t.label} ?`, goto: t.id }));
  F = { mode: 'q', theme: 'scan', stack: [{ list, idx: 0 }], path: ['Choix du thème'], asked: [], t0: Date.now(), priv: false };
  undo = []; showQ();
}
function quickQ(sg) {
  const t = theme(sg.theme), first = t?.items.find(x => x.l === sg.path[1]), rest = sg.path.slice(2).join(', ').toLowerCase();
  if (first?.ask) return first.q;
  if (first) return rest ? first.q.replace(/\s*\?$/, '') + ' : ' + rest + ' ?' : first.q;
  return 'Encore : ' + sg.path.slice(1).join(', ').toLowerCase() + ' ?';
}
function startQuick(sg) {
  F = { mode: 'q', theme: sg.theme, stack: [{ list: [{ id: 'quick', l: sg.path[sg.path.length - 1], q: quickQ(sg) }], idx: 0 }], path: sg.path.slice(0, -1), asked: [], t0: Date.now(), priv: false, quick: true };
  undo = []; showQ();
}
function showPlan() { F = { mode: 'done', theme: 'journee', path: ['Ma journée', 'Programme du jour'], result: 'resolu', action: 'planning', entryNotes: [], priv: false, quick: true }; render(); speak('Voici le programme de ta journée.'); }
function showQ() { F.qTs = Date.now(); render(); speak(cur().q); }

function answer(a) {
  flash(a);
  if ($('#ovRoot').firstChild) { if (a === 'parler') return; closeOv(); }
  if (a === 'parler') return talk();
  if (view !== 'patient') return;
  sayAnswer(a);
  if (F.mode === 'home') { if (a === 'oui') startScan(); return; }
  if (F.mode === 'spell') return spellAnswer(a);
  if (F.mode === 'deeper') {
    F.entryNotes.push([F.dq, a]);
    if (F.entry) { F.entry.notes.push([F.dq, a]); enqueue('note', { conversationId: F.entry.id, question: F.dq, answer: a }); }
    F.mode = 'done'; render(); return;
  }
  if (F.mode === 'done') { if (a === 'oui') { (F.theme === 'scan' || F.theme === 'parler' || F.quick) ? startScan() : startTheme(F.theme); } else goHome(); return; }
  if (F.mode !== 'q') return;
  undo.push(JSON.stringify(F));
  const it = cur(), rt = Date.now() - F.qTs;
  if (!F.priv && !it.private && it.id !== 'quick' && !it.id.startsWith('scan.')) {
    const x = st(it.id); x.a++; x[a === 'oui' ? 'y' : 'n']++; x.rt += rt;
    enqueue('events', { events: [{ key: it.id, theme: F.theme, answer: a, ms: rt, at: Date.now() }] });
  }
  F.asked.push(it.id);
  if (a === 'oui') {
    if (it.goto) return startTheme(it.goto);
    F.path.push(it.l); if (it.private) F.priv = true; if (it.urgent) F.urgent = true;
    if (it.action === 'spell') return startSpell(F.path.slice());
    const th = it.then === '@i' ? INTENS : it.then;
    if (th && th.length) { F.stack.push({ list: th === INTENS ? INTENS : ordered(th), idx: 0 }); return showQ(); }
    return conclude('resolu', it);
  }
  const top = F.stack[F.stack.length - 1]; top.idx++;
  if (top.idx >= top.list.length) {
    if (F.quick || (F.single && F.stack.length === 1)) return goHome();
    return conclude(F.stack.length > 1 ? 'resolu' : 'non-trouve');
  }
  showQ();
}
function record(entry) {
  S.history.unshift(entry);
  enqueue('conversation', { id: entry.id, theme: entry.theme, path: entry.path, result: entry.result, n: entry.n, dur: entry.dur, urgent: entry.urgent, at: entry.ts });
}
function newEntry(theme, path, result, extra = {}) {
  const id = globalThis.crypto?.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
  return { id, ts: Date.now(), theme, path, result, n: 0, dur: 0, urgent: false, notes: [], ...extra };
}
function conclude(result, it) {
  Object.assign(F, { mode: 'done', result, action: it?.action, ask: it?.ask, say: it?.say, entryNotes: [] });
  F.entry = null;
  if (!F.priv && F.theme !== 'scan') {
    F.entry = newEntry(F.theme, F.path.slice(), result, { n: F.asked.length, dur: Date.now() - F.t0, urgent: !!F.urgent });
    record(F.entry);
  }
  render();
  if (F.ask) return speak(F.ask, true);
  speak((result === 'non-trouve' ? 'Je n’ai pas trouvé. Tu veux épeler ?' : 'Compris : ' + F.path.slice(1).join(', ') + '.') + ' Autre chose ?');
  if (F.urgent) chime();
}
function back() {
  if (F.mode === 'spell' || F.mode === 'home') return goHome();
  if (F.mode === 'deeper') { F.mode = 'done'; return render(); }
  const s = undo.pop(); if (!s) return goHome();
  F = JSON.parse(s); showQ();
}

/* épellation lettre par lettre */
function startSpell(ctx) { F = { mode: 'spell', ctx: ctx || ['Message'], g: 0, l: null, text: '', priv: !!F.priv, theme: (F.theme && F.theme !== 'scan') ? F.theme : 'parler' }; render(); speak('On épelle. ' + spellQ()); }
const spellQ = () => F.l === null ? `Lettre dans : ${GROUPS[F.g].join(' ')} ?` : `« ${GROUPS[F.g][F.l]} » ?`;
function spellPick(g, l) {
  const v = GROUPS[g][l];
  if (v === 'ESPACE') F.text += ' ';
  else if (v === 'EFFACER') F.text = F.text.slice(0, -1);
  else if (v === 'ANNULER') return goHome();
  else if (v === 'TERMINER') {
    if (!F.text.trim()) return goHome();
    const path = [...F.ctx, F.text.trim()], th = F.theme, priv = F.priv, isAsk = th === 'interaction' || th === 'dire';
    F = { mode: 'done', theme: th, path, result: 'message', entryNotes: [], priv, ask: isAsk ? path[path.length - 1] : undefined, say: th === 'dire' };
    F.entry = priv ? null : newEntry(th, path, 'message');
    if (F.entry) record(F.entry);
    render(); speak((F.ask ? '' : 'Message : ') + path[path.length - 1], !!F.ask); return;
  } else F.text += v;
  F.g = 0; F.l = null; render(); speak(spellQ());
}
function spellAnswer(a) {
  if (F.l === null) { if (a === 'oui') F.l = 0; else F.g = (F.g + 1) % GROUPS.length; }
  else { if (a === 'oui') return spellPick(F.g, F.l); F.l++; if (F.l >= GROUPS[F.g].length) { F.l = null; F.g = (F.g + 1) % GROUPS.length; } }
  render(); speak(spellQ());
}

/* « je veux parler » */
function talk() {
  chime(); speak(`${name()} veut parler`);
  if (F.mode === 'q' && !F.priv && cur().id !== 'quick' && !cur().id.startsWith('scan.')) {

  $('#ovRoot').innerHTML = `<div class="ov" role="dialog" aria-modal="true" aria-labelledby="ovT"><div class="ovc">
    <h2 id="ovT">${esc(name())} veut parler</h2>

}

// Accueil pensé pour le téléphone, sans surcharge et sans défilement :
// une ligne par thème = le thème, ses 3 pictogrammes les plus importants (moteur de recommandation)
// et « + » pour le reste. Autant de lignes que l'écran en permet, puis Page suivante / Page précédente.
let boardPage = 0, boardTheme = null, themePage = 0;
const pic = (attrs, icon, label, h, extra = '') => `<button class="pic ${extra}" style="--h:${h}" ${attrs}>${icon}<span>${esc(label)}</span></button>`;
const pager = (page, pages, prev, next) => pages > 1 ? `<nav class="pager" aria-label="Pages">

// Pictogrammes d'un thème, les plus importants d'abord : personnes (thèmes Proches / Personnes) puis questions.
function themePics(t, h) {
  const people = t.dynamic ? ordered(peopleOf(t).map(p => personItem(t, p))).map(it => { const p = S.people.find(x => x.id === it.person); return pic(`data-person="${esc(p.id)}"`, avatar(p), p.name, h); }) : [];
  const items = ordered(t.items).map(it => pic(`data-item="${esc(it.id)}" data-th="${esc(t.id)}"`, ic(itemIcon(it, t)), it.l, h, it.urgent ? 'urg' : ''));

function boardSpace() { return Math.max(320, ($('#main')?.clientHeight || 600) - 24); }

  const perPage = Math.max(3, Math.floor((avail - 64) / rowH));   // 64 = barre de pages

    return `<div class="trow" style="--h:${h}">

  }), `<div class="trow" style="--h:40"><div class="tlab">${ic('spell')}<span>Autres</span></div>${pic('data-act="spell"', ic('spell'), 'Épeler', 40)}${pic('data-act="plan"', ic('plan'), 'Ma journée', 95)}${pic('data-act="scan"', ic('scan'), 'Tout parcourir', 40)}<span></span></div>`];

// Page d'un thème : tous ses pictogrammes, en pages si besoin.

addEventListener('resize', () => { if (view === 'patient' && F.mode === 'home' && S) render(); });
const crumbs = () => `<div class="crumbs">${F.path.map(p => `<span class="c">${esc(p)}</span>`).join('<span>›</span>')}${F.priv ? `<span class="c lockb">${ic('intime')} Non enregistré</span>` : ''}</div>`;

      <p class="next">Autre chose, ${esc(name())} ?</p>

  </div>`;
}
const renderDeeper = () => `<div class="qv">${crumbs()}<span class="pill t" style="align-self:flex-start">Pour aller plus loin</span><h1 class="q">${esc(F.dq)}</h1></div>`;
function renderSpell() {

$('#main').addEventListener('click', e => {
  if (view !== 'patient' || !S) return;
  const g = x => e.target.closest(x);
  let b;
  if ((b = g('[data-item]'))) return startItem(b.dataset.th, b.dataset.item);
  if ((b = g('[data-person]'))) { const p = S.people.find(x => x.id === b.dataset.person), th = personTheme(p); return startTheme(th, `${th}.${p.id}`); }
  if ((b = g('[data-top]'))) { const o = topCache[+b.dataset.top]; return o.kind === 'sugg' ? startQuick(o.sg) : startItem(o.t.id, o.it.id); }
  if ((b = g('[data-deep]'))) { F.dq = deeperList()[+b.dataset.deep]; F.mode = 'deeper'; render(); speak(F.dq); return; }
  if ((b = g('[data-pick]'))) { const [x, y] = b.dataset.pick.split(',').map(Number); return spellPick(x, y); }
  if ((b = g('[data-act]'))) {
    const a = b.dataset.act;
    if (a === 'scan') startScan(); else if (a === 'spell') startSpell(['Message']); else if (a === 'plan') showPlan();
    else if (a === 'themeScan') startTheme(b.dataset.th);
    else if (a === 'openTheme') { boardTheme = b.dataset.th; themePage = 0; render(); }
    else if (a === 'closeTheme') { boardTheme = null; render(); }
    else if (a === 'nextPage') { boardPage++; render(); } else if (a === 'prevPage') { boardPage = Math.max(0, boardPage - 1); render(); }
    else if (a === 'nextTheme') { themePage++; render(); } else if (a === 'prevTheme') { themePage = Math.max(0, themePage - 1); render(); }
    else if (a === 'spellctx') startSpell([...F.path]); else if (a === 'reread') speak(F.ask, true);
  }
});

$('#bNo').onclick = () => answer('non');
$('#bTalk').onclick = () => answer('parler');
document.addEventListener('keydown', e => {
  if (!S || e.target.matches('input,textarea,select')) return;

  } catch (e) {
    if (e.status === 401) return renderSetup('Ce lien n’est plus valide (il a peut-être été renouvelé).');
    $('#main').innerHTML = `<div class="setup"><h1>Connexion impossible</h1><p>${esc(e.message)}</p><button class="btn primary" id="retry">Réessayer</button></div>`;
    $('#retry').onclick = () => location.reload();
    return;
  }
  document.title = `Parler avec ${name()}`;
  render();
  flush();
  setInterval(() => { const c = document.querySelector('.clock'); if (c) { const now = new Date(); c.textContent = now.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' + fmtT(now); } }, 30000);
}
boot();

</script>
