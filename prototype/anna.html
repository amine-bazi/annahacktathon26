<title>Parler avec Anna</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mobile-first AAC board — category rail on the left, big uniform cells on the right, fixed Non · Parler · Oui bar */
:root{
  --bg:#EEF2F1; --panel:#FFFFFF; --panel-2:#E3EAE8; --ink:#13211F; --muted:#566865; --line:#CFD9D6;
  --accent:#0F5E63; --accent-ink:#FFFFFF; --yes:#1E7A4C; --no:#B2412E; --talk:#B87A08; --urgent:#B3261E; --priv:#5A4C8C;
  --tl:36%; --tint:13%;
  --f:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:16px; --rail:88px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1615; --panel:#15201F; --panel-2:#1C2A28; --ink:#E5EEEC; --muted:#93A6A2; --line:#2A3B38;
  --accent:#4FB0AC; --accent-ink:#06201F; --yes:#3E9E6D; --no:#C9604C; --talk:#E6B043; --urgent:#F0675C; --priv:#A497E0;
  --tl:68%; --tint:16%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1615; --panel:#15201F; --panel-2:#1C2A28; --ink:#E5EEEC; --muted:#93A6A2; --line:#2A3B38;
  --accent:#4FB0AC; --accent-ink:#06201F; --yes:#3E9E6D; --no:#C9604C; --talk:#E6B043; --urgent:#F0675C; --priv:#A497E0;
  --tl:68%; --tint:16%; color-scheme:dark}
@media (min-width:720px){:root{--rail:176px}}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:1180px;margin:0 auto;padding-inline:16px}
.muted{color:var(--muted)}

/* top */
.top{display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.who{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0;overflow:hidden}
@media (max-width:430px){.who .clock .d{display:none}}
.who b{font-size:22px}
.who .clock{font-family:var(--mono);color:var(--muted);font-size:13px;white-space:nowrap}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;min-width:42px;padding:0 11px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.ib svg{font-size:20px}
.ib.on{border-color:var(--accent);color:var(--accent)}
.ib.nav-b{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:430px){.who .clock{display:none}}
.ib .lb{display:none}
@media (min-width:720px){.ib .lb{display:inline}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--no)}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:9px}

/* main */
.main{overflow:auto;min-height:0;padding-block:12px}
.main.board-mode{overflow:hidden}

/* board: rail + grid */
.board{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:12px;height:100%;min-height:0}
.rail{display:flex;flex-direction:column;gap:6px;overflow-y:auto;padding-right:2px;min-height:0;-webkit-overflow-scrolling:touch}
.rb{flex:none}
.rb{--tc:hsl(var(--h) 48% var(--tl));display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:14px;border:2px solid transparent;background:transparent;font-size:12.5px;font-weight:700;text-align:center;line-height:1.15;transition:background .15s}
.rb svg{font-size:28px;color:var(--tc)}
.rb:hover{background:var(--panel)}
.rb.cur{background:color-mix(in srgb,var(--tc) var(--tint),var(--panel));border-color:var(--tc)}
@media (min-width:720px){.rb{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;font-size:16px;text-align:left}.rb svg{font-size:26px}}
.gridwrap{overflow-y:auto;min-width:0;min-height:0;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 0 10px}
.ghead h2{margin:0;font-size:20px}
.ghead span{font-size:13px;color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.cells{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.cells{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cell{--tc:hsl(var(--h) 48% var(--tl));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:124px;padding:12px 8px;border-radius:var(--r);border:2px solid color-mix(in srgb,var(--tc) 35%,var(--line));background:color-mix(in srgb,var(--tc) var(--tint),var(--panel));text-align:center;transition:transform .12s,border-color .12s}
.cell:hover{border-color:var(--tc)}
.cell:active{transform:scale(.97)}
.cell>svg{font-size:44px;color:var(--tc)}
.cell b{font-size:17px;line-height:1.15}
.cell small{font-size:12.5px;color:var(--muted);line-height:1.2}
.cell .av{width:52px;height:52px;font-size:19px}
.cell.urg{border-color:var(--urgent)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff;flex:none}

/* question */
.qv{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.crumbs .c{padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.crumbs .lockb{color:var(--priv);border-color:var(--priv)}
.q{font-size:clamp(30px,7vw,60px);line-height:1.12;font-weight:700;margin:0;text-wrap:balance}
.qmeta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.pill.ok{color:var(--yes);border-color:var(--yes)}.pill.ko{color:var(--no);border-color:var(--no)}.pill.u{color:var(--urgent);border-color:var(--urgent)}.pill.t{color:var(--talk);border-color:var(--talk)}
.done{display:grid;grid-template-columns:1fr;gap:14px;max-width:1100px;margin:0 auto}
@media (min-width:900px){.done{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.result{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.result.urgent{border:2px solid var(--urgent)}
.tag{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.big{font-size:clamp(26px,5vw,44px);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
.urg{color:var(--urgent);font-weight:700;margin:0}
.notes{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.notes li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;background:var(--bg);font-size:15px}
.ans-y{color:var(--yes);font-weight:700}.ans-n{color:var(--no);font-weight:700}
.next{font-size:clamp(21px,4vw,28px);font-weight:700;margin:4px 0 0}
.deeper{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.deeper h3{margin:0 0 4px;font-size:16px;display:flex;gap:8px;align-items:center}
.deeper p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.dlist{display:flex;flex-direction:column;gap:6px}
.dlist button{text-align:left;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.dlist button:hover{border-color:var(--accent)}
.dlist button.asked{opacity:.5}
.plist{list-style:none;margin:0;padding:0;font-size:17px;display:flex;flex-direction:column;gap:4px}
.plist time{font-family:var(--mono);font-size:14px;color:var(--muted);margin-right:8px}

/* spell */
.spell{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.typed{font-family:var(--mono);font-size:clamp(26px,6vw,46px);min-height:1.6em;padding:10px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);word-break:break-word}
.caret{display:inline-block;width:.55ch;background:var(--accent);animation:blink 1s steps(2) infinite;height:1em;vertical-align:-.12em}
@keyframes blink{50%{opacity:0}}
.lg{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border-radius:12px;border:2px solid transparent}
.lg.cur{border-color:var(--talk);background:color-mix(in srgb,var(--talk) 10%,transparent)}
.lg button{min-width:44px;height:46px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:20px;font-weight:700}
.lg button.cur{background:var(--talk);color:#1b1300;border-color:var(--talk)}
.lg button.act{font-size:13px}

/* answer bar */
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ans{height:clamp(68px,10vh,100px);border-radius:18px;border:none;font-size:clamp(24px,5vw,38px);font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;transition:transform .1s,filter .15s}
.ans:active,.ans.flash{transform:scale(.97);filter:brightness(1.15)}
.ans.flash{outline:4px solid var(--ink);outline-offset:3px}
.ans.no{background:var(--no)}.ans.yes{background:var(--yes)}
.ans{padding:0 6px;min-width:0}
.ans.talk{background:var(--talk);color:#1b1300;font-size:15px;padding:0 12px;min-width:84px;flex-direction:column;gap:2px}
.ans.talk svg{font-size:28px}
.ans .long{display:none}
@media (min-width:600px){.ans .long{display:inline}.ans .short{display:none}.ans.talk{min-width:150px;font-size:18px}}
.ans[disabled]{opacity:.35;cursor:default}

/* camera */
.cam{position:fixed;right:16px;top:calc(64px + env(safe-area-inset-top,0px));width:132px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5}
@media (min-width:720px){.cam{width:190px;top:auto;bottom:calc(130px + env(safe-area-inset-bottom,0px))}}
.cam video{width:100%;display:block;transform:scaleX(-1);aspect-ratio:4/3;object-fit:cover;background:#000}
.cam .st{padding:6px 8px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.meter{display:grid;grid-template-columns:36px 1fr;gap:6px;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.meter i{height:5px;border-radius:3px;background:var(--panel-2);position:relative;overflow:hidden}
.meter i b{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}

/* overlay + toast */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:20;padding:16px}
.ovc{background:var(--panel);border:3px solid var(--talk);border-radius:20px;padding:22px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px}
.ovc h2{margin:0;font-size:clamp(26px,6vw,36px)}
.ovc .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ovc .row .btn{justify-content:center;padding:14px 10px;font-size:16px}
.ovc.lock{border-color:var(--accent)}
.ovc .err{color:var(--no);font-weight:700;margin:0;min-height:1.2em}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:15px;max-width:calc(100% - 32px)}

/* admin (simple, one column) */
.adm{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--panel-2);position:sticky;top:0;z-index:2}
.seg button{padding:10px 6px;border:none;border-radius:10px;background:transparent;font-size:15px;color:var(--muted);font-weight:700}
.seg button.cur{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .n{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;display:block}
.stat .l{font-size:13px;color:var(--muted)}
.stat.warn{border-color:var(--urgent)}.stat.warn .n{color:var(--urgent)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:none}
.rows .t{flex:1;min-width:0}
.rows .t small{display:block;color:var(--muted);font-size:13px}
.rows time{font-family:var(--mono);font-size:12.5px;color:var(--muted);width:64px;flex:none;align-self:flex-start;padding-top:2px}
.rows .l1{padding-left:20px}.rows .l2{padding-left:40px}
.sbar{width:64px;height:7px;background:var(--panel-2);border-radius:4px;position:relative;flex:none}
.sbar b{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;white-space:nowrap}
.chips button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fgrid{display:grid;gap:10px}
@media (min-width:640px){.fgrid.c2{grid-template-columns:1fr 1fr}}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=search],select,textarea{font:inherit;font-size:16px;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{font-family:var(--mono);font-size:14px;min-height:170px}
.ck{display:flex;gap:8px;align-items:center;font-size:15px}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
summary{cursor:pointer;font-weight:700;font-size:15px;padding:4px 0;color:var(--accent)}
details[open] summary{margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const fmtD=ts=>{ const d=new Date(ts), t=new Date(), y=new Date(); y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString()) return 'Auj.'; if(d.toDateString()===y.toDateString()) return 'Hier';
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); };
function hue(s){ return [...String(s)].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360; }
const avatar=p=>`<span class="av" style="background:hsl(${hue(p.name)} 38% 42%)">${esc(p.name.replace(/^Dr\.? /,'').slice(0,1))}</span>`;
function toast(msg){ const d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2800); }
let answerSaidAt=0;
function sayAnswer(a){ if(!('speechSynthesis' in window)) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(a==='oui'?'Oui':'Non'); u.lang='fr-FR'; u.rate=.95; speechSynthesis.speak(u); answerSaidAt=Date.now(); }catch(e){} }
function speak(t,force){ if((!S.settings.voice&&!force)||!('speechSynthesis' in window)) return; try{ if(Date.now()-answerSaidAt>1500) speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='fr-FR'; u.rate=.95; speechSynthesis.speak(u);}catch(e){} }
function chime(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); [660,880].forEach((f,i)=>{ const o=a.createOscillator(), g=a.createGain(); o.frequency.value=f; o.connect(g); g.connect(a.destination); const t0=a.currentTime+i*.22; g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.25,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+.35); o.start(t0); o.stop(t0+.4); }); }catch(e){} }

/* ================================================================ recommendation engine */
function st(id){ return S.stats[id]||(S.stats[id]={a:0,y:0,n:0,p:0,rt:0}); }
function scoreOf(id){
  const x=S.stats[id]; if(!x||!x.a) return {score:.3,hit:0,a:0,avg:0};
  const maxA=Math.max(1,...Object.values(S.stats).map(v=>v.a));
  const hit=(x.y+1)/(x.a+2), use=x.a/maxA, avg=x.rt/x.a, speed=Math.max(0,Math.min(1,1-avg/8000));
  return {score:.5*hit+.3*use+.2*speed, hit, a:x.a, avg};
}
function ordered(list){
  if(!S.settings.reco||!Array.isArray(list)) return list;
  return list.map((it,i)=>({it,i,s:scoreOf(it.id).score})).sort((a,b)=>(b.it.urgent?1:0)-(a.it.urgent?1:0) || (a.it.action==='spell')-(b.it.action==='spell') || b.s-a.s || a.i-b.i).map(o=>o.it);
}
function peopleOf(t){ return S.people.filter(p=>personTheme(p)===t.id); }
function themeItems(t){
  if(!t.dynamic) return ordered(t.items);
  const ppl=peopleOf(t).map(p=>({id:t.id+'.'+p.id, l:p.name, q:`C’est à propos de ${p.name} (${p.role}) ?`, person:p.id,
    then:PERSON_FOLLOW.map(([l,q,a])=>({id:t.id+'.'+p.id+'.'+slug(l), l, q:q.replace('{n}',p.name), action:a}))}));
  return [...ordered(ppl), ...t.items];
}
function suggestions(){
  const now=Date.now(), hr=new Date().getHours(), map=new Map();
  S.history.filter(e=>e.result==='resolu' && e.path.length>1 && theme(e.theme)).forEach(e=>{
    const k=e.theme+'|'+e.path.join('|'); const dh=Math.abs(new Date(e.ts).getHours()-hr);
    const w=(Math.min(dh,24-dh)<=2?2:1)*Math.exp(-(now-e.ts)/(7*864e5));
    const m=map.get(k)||{theme:e.theme,path:e.path,w:0}; m.w+=w; map.set(k,m);
  });
  return [...map.values()].sort((a,b)=>b.w-a.w).slice(0,5);
}

/* ================================================================ flow */
let F={mode:'home'}, undo=[], view='patient', cat='__rapide';
function cur(){ const top=F.stack[F.stack.length-1]; return top.list[top.idx]; }
function goHome(){ F={mode:'home'}; undo=[]; render(); }
function startTheme(id, pre){
  const t=theme(id); if(!t) return;
  const list=themeItems(t);
  if(!list.length){ toast('« '+t.label+' » n’a pas encore de questions : ajoute-les dans l’espace admin.'); return goHome(); }
  F={mode:'q', theme:id, stack:[{list, idx:0}], path:[t.label], asked:[], t0:Date.now(), priv:!!t.private, urgent:false};
  undo=[];
  if(pre){ const it=F.stack[0].list.find(x=>x.id===pre); if(it){ F.path.push(it.l); F.stack.push({list:ordered(it.then), idx:0}); } }
  showQ();
}
function startScan(){
  const list=S.themes.filter(t=>themeItems(t).length).map(t=>({t,u:S.history.filter(e=>e.theme===t.id).length})).sort((a,b)=>b.u-a.u)
    .map(({t})=>({id:'scan.'+t.id, l:t.label, q:`C’est à propos de : ${t.label} ?`, goto:t.id}));
  F={mode:'q', theme:'scan', stack:[{list, idx:0}], path:['Choix du thème'], asked:[], t0:Date.now(), priv:false};
  undo=[]; showQ();
}
function quickQ(sg){
  const t=theme(sg.theme), first=t&&t.items.find(x=>x.l===sg.path[1]);
  const rest=sg.path.slice(2).join(', ').toLowerCase();
  if(first && first.ask) return first.q;
  if(first) return rest ? first.q.replace(/\s*\?$/,'')+' : '+rest+' ?' : first.q;
  return 'Encore : '+sg.path.slice(1).join(', ').toLowerCase()+' ?';
}
function startQuick(sg){
  const leaf=sg.path[sg.path.length-1];
  F={mode:'q', theme:sg.theme, stack:[{list:[{id:'quick', l:leaf, q:quickQ(sg)}], idx:0}], path:sg.path.slice(0,-1), asked:[], t0:Date.now(), priv:false, quick:true};
  undo=[]; showQ();
}
function showPlan(){ F={mode:'done', theme:'journee', path:['Ma journée','Programme du jour'], result:'resolu', action:'planning', entryNotes:[], priv:false, quick:true}; render(); speak('Voici le programme de ta journée.'); }
function showQ(){ F.qTs=Date.now(); render(); speak(cur().q); }

function answer(a){
  flash(a);
  if($('#ovRoot').firstChild){ if(a==='parler') return; closeOv(); }
  if(a==='parler') return talk();
  if(view!=='patient') return;
  sayAnswer(a);
  if(F.mode==='home'){ if(a==='oui') startScan(); return; }
  if(F.mode==='spell') return spellAnswer(a);
  if(F.mode==='deeper'){ F.entryNotes.push([F.dq,a]); if(F.entry){ F.entry.notes.push([F.dq,a]); save(); } F.mode='done'; render(); return; }
  if(F.mode==='done'){ if(a==='oui'){ (F.theme==='scan'||F.theme==='parler'||F.quick)?startScan():startTheme(F.theme); } else goHome(); return; }
  if(F.mode!=='q') return;
  undo.push(JSON.stringify(F));
  const it=cur(), rt=Date.now()-F.qTs;
  if(!F.priv && !it.private && it.id!=='quick' && !it.id.startsWith('scan.')){ const x=st(it.id); x.a++; x[a==='oui'?'y':'n']++; x.rt+=rt; save(); }
  F.asked.push(it.id);
  if(a==='oui'){
    if(it.goto) return startTheme(it.goto);
    F.path.push(it.l); if(it.private) F.priv=true; if(it.urgent) F.urgent=true;
    if(it.action==='spell') return startSpell(F.path.slice());
    const th=it.then==='@i'?INTENS:it.then;
    if(th && th.length){ F.stack.push({list:th===INTENS?INTENS:ordered(th), idx:0}); return showQ(); }
    return conclude('resolu', it);
  }
  const top=F.stack[F.stack.length-1]; top.idx++;
  if(top.idx>=top.list.length){
    if(F.quick) return goHome();
    return conclude(F.stack.length>1?'resolu':'non-trouve');
  }
  showQ();
}
function conclude(result, it){
  Object.assign(F,{mode:'done', result, action:it?.action, ask:it?.ask, say:it?.say, entryNotes:[]});
  if(!F.priv && F.theme!=='scan'){
    F.entry={ts:Date.now(), theme:F.theme, path:F.path.slice(), result, n:F.asked.length, dur:Date.now()-F.t0, urgent:F.urgent, notes:[]};
    S.history.unshift(F.entry); save();
  } else F.entry=null;
  render();
  if(F.ask) return speak(F.ask, true);
  speak((result==='non-trouve'?'Je n’ai pas trouvé. Tu veux épeler ?':'Compris : '+F.path.slice(1).join(', ')+'.')+' Autre chose ?');
  if(F.urgent) chime();
}
function back(){ if(F.mode==='spell'||F.mode==='home') return goHome(); if(F.mode==='deeper'){ F.mode='done'; return render(); } const s=undo.pop(); if(!s) return goHome(); F=JSON.parse(s); showQ(); }

/* spelling */
const GROUPS=[['E','S','A','I','N','T','R','U','L'],['O','D','C','M','P','G','B','V','H'],['F','Q','J','X','Y','Z','K','W','’'],['ESPACE','EFFACER','TERMINER','ANNULER']];
function startSpell(ctx){ F={mode:'spell', ctx:ctx||['Message'], g:0, l:null, text:'', priv:!!F.priv, theme:(F.theme&&F.theme!=='scan')?F.theme:'parler'}; render(); speak('On épelle. '+spellQ()); }
function spellQ(){ return F.l===null?`Lettre dans : ${GROUPS[F.g].join(' ')} ?`:`« ${GROUPS[F.g][F.l]} » ?`; }
function spellPick(g,l){
  const v=GROUPS[g][l];
  if(v==='ESPACE') F.text+=' '; else if(v==='EFFACER') F.text=F.text.slice(0,-1);
  else if(v==='ANNULER') return goHome();
  else if(v==='TERMINER'){
    if(!F.text.trim()) return goHome();
    const path=[...F.ctx, F.text.trim()], th=F.theme, priv=F.priv;
    F={mode:'done', theme:th, path, result:'message', entryNotes:[], priv, ask:(th==='interaction'||th==='dire')?path[path.length-1]:undefined, say:th==='dire'};
    if(!priv){ F.entry={ts:Date.now(), theme:th, path, result:'message', n:0, dur:0, notes:[]}; S.history.unshift(F.entry); save(); }
    render(); speak((F.ask?'':'Message : ')+path[path.length-1], !!F.ask); return;
  } else F.text+=v;
  F.g=0; F.l=null; render(); speak(spellQ());
}
function spellAnswer(a){
  if(F.l===null){ if(a==='oui') F.l=0; else F.g=(F.g+1)%GROUPS.length; }
  else { if(a==='oui') return spellPick(F.g,F.l); F.l++; if(F.l>=GROUPS[F.g].length){ F.l=null; F.g=(F.g+1)%GROUPS.length; } }
  render(); speak(spellQ());
}

/* « je veux parler » */
function talk(){
  chime(); speak('Anna veut parler');
  if(F.mode==='q' && !F.priv && cur().id!=='quick'){ st(cur().id).p++; }
  if(!F.priv){ S.history.unshift({ts:Date.now(), theme:'parler', path:['Demande de parole'], result:'parole', n:0, dur:0, notes:[]}); save(); }
  $('#ovRoot').innerHTML=`<div class="ov" role="dialog" aria-modal="true" aria-labelledby="ovT"><div class="ovc">
    <h2 id="ovT">Anna veut parler</h2>
    <p class="muted" style="margin:0">Approche-toi et choisis avec elle comment continuer.</p>
    <div class="row">
      <button class="btn primary" data-ov="spell">${ic('spell')} Épeler</button>
      <button class="btn" data-ov="scan">${ic('scan')} Les thèmes</button>
      <button class="btn" data-ov="proches">${ic('proches')} Un proche</button>
      <button class="btn" data-ov="close">Fermer</button>
    </div></div></div>`;
}
function closeOv(){ $('#ovRoot').innerHTML=''; }
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-ov]'); if(!b) return; const k=b.dataset.ov; closeOv(); view='patient';
  if(k==='spell') startSpell(['Message']); else if(k==='scan') startScan(); else if(k==='proches') startTheme('proches'); else render();
});

/* ================================================================ render: patient */
function render(){
  renderTop();
  const m=$('#main');
  $('#bar').hidden=(view!=='patient');
  m.classList.toggle('board-mode', view==='patient' && F.mode==='home');
  if(view==='admin'){ m.innerHTML=renderAdmin(); bindAdmin(); return; }
  m.innerHTML = F.mode==='home'?renderBoard() : F.mode==='q'?renderQ() : F.mode==='done'?renderDone() : F.mode==='deeper'?renderDeeper() : renderSpell();
  m.scrollTop=0;
}
let unlocked=false;
function pinHash(c){ let h=2166136261; for(const ch of 'anna-'+c){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return (h>>>0).toString(16); }
function openAdmin(){
  if(unlocked){ view='admin'; return render(); }
  const create=!S.settings.pin;
  $('#ovRoot').innerHTML=`<div class="ov" role="dialog" aria-modal="true" aria-labelledby="lkT"><form class="ovc lock" id="lockF">
    <h2 id="lkT" style="font-size:26px">${ic('intime')} ${create?'Créer le code admin':'Espace admin'}</h2>
    <p class="muted" style="margin:0">${create?'Choisis un code d’au moins 4 caractères. Il sera demandé à chaque accès.':'Entre le code soignant pour continuer.'}</p>
    <input type="password" id="pin1" inputmode="numeric" autocomplete="off" placeholder="Code" aria-label="Code" required minlength="4">
    ${create?'<input type="password" id="pin2" inputmode="numeric" autocomplete="off" placeholder="Confirmer le code" aria-label="Confirmer le code" required minlength="4">':''}
    <p class="err" id="pinErr"></p>
    <div class="row"><button class="btn primary">${create?'Créer et entrer':'Déverrouiller'}</button><button class="btn" type="button" data-ov="close">Annuler</button></div>
  </form></div>`;
  $('#pin1').focus();
  $('#lockF').onsubmit=e=>{ e.preventDefault(); const a=$('#pin1').value;
    if(create){ if(a.length<4) return $('#pinErr').textContent='Au moins 4 caractères.'; if(a!==$('#pin2').value) return $('#pinErr').textContent='Les deux codes sont différents.'; S.settings.pin=pinHash(a); save(); }
    else if(pinHash(a)!==S.settings.pin){ $('#pin1').value=''; $('#pin1').focus(); return $('#pinErr').textContent='Code incorrect.'; }
    unlocked=true; closeOv(); view='admin'; render(); };
}
function renderTop(){
  const now=new Date();
  $('#top').innerHTML=`
    <div class="who"><b>Anna</b><span class="clock"><span class="d">${now.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})} · </span>${fmtT(now)}</span></div>
    ${view==='patient'&&F.mode!=='home'?`<button class="ib nav-b" id="tBack" aria-label="Retour">${ic('back')}<span class="lb">Retour</span></button><button class="ib nav-b" id="tHome" aria-label="Accueil">${ic('home')}<span class="lb">Accueil</span></button>`:''}
    <button class="ib ${cam.on?'on':''}" id="tCam" aria-label="Caméra" title="Détection des mouvements de tête">${ic('cam')}<span class="lb">${cam.on?'Tête active':'Caméra'}</span></button>
    <button class="ib ${S.settings.voice?'on':''}" id="tVoice" aria-label="Voix" title="Lire les questions à voix haute">${ic('voice')}<span class="lb">Voix</span></button>
    <button class="ib ${view==='admin'?'on':''}" id="tView" aria-label="${view==='admin'?'Retour à Anna':'Espace admin'}">${view==='admin'?ic('home'):ic('gear')}<span class="lb">${view==='admin'?'Vue Anna':'Admin'}</span></button>`;
  const tb=$('#tBack'), th=$('#tHome'); if(tb) tb.onclick=back; if(th) th.onclick=goHome;
  $('#tCam').onclick=()=>cam.on?stopCam():startCam();
  $('#tVoice').onclick=()=>{ S.settings.voice=!S.settings.voice; save(); renderTop(); if(S.settings.voice) speak('Lecture à voix haute activée'); };
  $('#tView').onclick=()=>{ if(view==='admin'){ view='patient'; unlocked=false; render(); toast('Espace soignant verrouillé'); } else openAdmin(); };
}
function railItems(){
  const used=S.types.filter(ty=>S.themes.some(t=>t.group===ty.name));
  return [{name:'__rapide', short:'Rapide', icon:'star', h:40}, ...used];
}
function renderBoard(){
  const rail=railItems(); if(!rail.some(r=>r.name===cat)) cat='__rapide';
  const cur=rail.find(r=>r.name===cat);
  let head, cells;
  if(cat==='__rapide'){
    head=['Accès rapide','Hoche la tête pour tout parcourir'];
    cells=[
      `<button class="cell" style="--h:40" data-act="scan">${ic('scan')}<b>Tout parcourir</b><small>Oui / non thème par thème</small></button>`,
      ...suggestions().map((s,i)=>{ const t=theme(s.theme); return `<button class="cell" style="--h:${typeOf(t.group).h}" data-sugg="${i}">${ic(iconFor(t))}<b>${esc(s.path.slice(1).join(' · '))}</b><small>${esc(t.label)} · fréquent</small></button>`; }),
      `<button class="cell" style="--h:300" data-theme="interaction">${ic('interaction')}<b>Poser une question</b><small>Anna demande à quelqu’un</small></button>`,
      `<button class="cell" style="--h:95" data-act="plan">${ic('plan')}<b>Ma journée</b><small>Le programme</small></button>`,
      `<button class="cell" style="--h:40" data-act="spell">${ic('spell')}<b>Épeler</b><small>Lettre par lettre</small></button>`,
    ];
  } else {
    const ts=S.themes.filter(t=>t.group===cat);
    head=[cat, ts.length+' thème'+(ts.length>1?'s':'')];
    cells=[];
    ts.forEach(t=>{
      cells.push(`<button class="cell" style="--h:${cur.h}" data-theme="${t.id}">${ic(t.private?'intime':iconFor(t))}<b>${esc(t.label)}</b><small>${esc(t.sub||'')}</small></button>`);
      if(t.dynamic) peopleOf(t).forEach(p=>cells.push(`<button class="cell" style="--h:${cur.h}" data-person="${p.id}">${avatar(p)}<b>${esc(p.name)}</b><small>${esc(p.role)}</small></button>`));
    });
  }
  return `<div class="board">
    <nav class="rail" aria-label="Catégories">${rail.map(r=>`<button class="rb ${r.name===cat?'cur':''}" style="--h:${r.h}" data-cat="${esc(r.name)}">${ic(r.icon)}<span>${esc(r.short)}</span></button>`).join('')}</nav>
    <div class="gridwrap"><div class="ghead"><h2>${esc(head[0])}</h2><span>${esc(head[1])}</span></div><div class="cells">${cells.join('')}</div></div>
  </div>`;
}
function crumbs(){ return `<div class="crumbs">${F.path.map(p=>`<span class="c">${esc(p)}</span>`).join('<span>›</span>')}${F.priv?`<span class="c lockb">${ic('intime')} Non enregistré</span>`:''}</div>`; }
const navBtns=()=>'';
function renderQ(){
  const it=cur(), top=F.stack[F.stack.length-1];
  return `<div class="qv">${navBtns()}${crumbs()}
    <h1 class="q">${esc(it.q)}</h1>
    <div class="qmeta"><span>${top.idx+1} / ${top.list.length}</span>${it.urgent?'<span class="pill u">Prioritaire</span>':''}<span>Hocher = oui · tourner = non · pencher 1 s = parler</span></div>
  </div>`;
}
function deeperList(){ return theme(F.theme)?.deeper||[]; }
function renderDone(){
  const plan=F.action==='planning'?`<ul class="plist">${parsePlan().map(p=>`<li><time>${p.t}</time>${esc(p.label)}</li>`).join('')}</ul>`:'';
  const time=F.action==='heure'?`<p class="big" style="font-size:26px">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})} · ${fmtT(Date.now())}</p>`:'';
  const title=F.result==='non-trouve'?'Besoin non trouvé':F.result==='message'?'« '+F.path[F.path.length-1]+' »':(F.path.slice(1).join(' › ')||F.path[0]);
  const asked=new Set(F.entryNotes.map(n=>n[0])), dl=deeperList();
  return `<div class="done"><div class="result ${F.urgent?'urgent':''}">
      ${navBtns()}${crumbs()}
      ${F.ask?`<span class="tag">${F.say?'Anna te dit':'Anna te demande'}</span><p class="big" style="font-size:clamp(32px,7vw,60px)">${esc(F.ask)}</p><div><button class="btn" data-act="reread">${ic('voice')} Relire à voix haute</button></div>`:`
      <span class="tag">${F.result==='non-trouve'?'Pas dans la liste':F.result==='message'?'Message d’Anna':'Anna a exprimé'}</span>
      <p class="big">${esc(title)}</p>`}
      ${F.urgent?'<p class="urg">Prioritaire : préviens l’équipe soignante maintenant.</p>':''}
      ${plan}${time}
      ${F.result==='non-trouve'?`<div><button class="btn primary" data-act="spellctx">${ic('spell')} Épeler avec Anna</button></div>`:''}
      ${F.entryNotes.length?`<ul class="notes">${F.entryNotes.map(([q,a])=>`<li><span>${esc(q)}</span><span class="${a==='oui'?'ans-y':'ans-n'}">${a==='oui'?'Oui':'Non'}</span></li>`).join('')}</ul>`:''}
      <p class="next">Autre chose, Anna ?</p>
      <span class="muted" style="font-size:13.5px">Oui : continuer dans ce thème · Non : accueil</span>
    </div>
    ${dl.length?`<div class="deeper"><h3>${ic('deeper')} Pour aller plus loin</h3>
      <p>Pour l’entourage : touche une question pour la poser à Anna.</p>
      <div class="dlist">${dl.map((q,i)=>`<button data-deep="${i}" class="${asked.has(q)?'asked':''}">${esc(q)}</button>`).join('')}</div></div>`:''}
  </div>`;
}
function renderDeeper(){ return `<div class="qv">${navBtns()}${crumbs()}<span class="pill t" style="align-self:flex-start">Pour aller plus loin</span><h1 class="q">${esc(F.dq)}</h1></div>`; }
function renderSpell(){
  return `<div class="spell">${navBtns()}
    <div class="typed">${esc(F.text)}<span class="caret"></span></div>
    <h1 class="q" style="font-size:clamp(22px,5vw,36px)">${esc(spellQ())}</h1>
    <div>${GROUPS.map((g,gi)=>`<div class="lg ${gi===F.g?'cur':''}">${g.map((c,li)=>`<button class="${c.length>1?'act':''} ${gi===F.g&&li===F.l?'cur':''}" data-pick="${gi},${li}">${c}</button>`).join('')}</div>`).join('')}</div>

/* ================================================================ suivi de tête (MediaPipe Face Mesh) */
const cam={on:false, fm:null, stream:null, base:null, calib:[], exc:null, cool:0, rollT:0};
const MP='https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/';
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.crossOrigin='anonymous'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function startCam(){
  try{ cam.stream=await navigator.mediaDevices.getUserMedia({video:{width:320,height:240,facingMode:'user'}}); }
  catch(e){ toast('Caméra indisponible ici : utilise les boutons ou les touches O / N / P.'); return; }
  $('#cam').hidden=false; $('#camMsg').textContent='Chargement…';
  try{ if(!window.FaceMesh) await loadScript(MP+'face_mesh.js'); }catch(e){ $('#camMsg').textContent='Suivi indisponible (réseau).'; return; }
  const v=$('#vid'); v.srcObject=cam.stream; await v.play();
  cam.fm=new FaceMesh({locateFile:f=>MP+f}); cam.fm.setOptions({maxNumFaces:1, refineLandmarks:false, minDetectionConfidence:.5, minTrackingConfidence:.5});
  cam.fm.onResults(onFace); cam.on=true; cam.base=null; cam.calib=[]; renderTop();
  $('#camMsg').textContent='Calibration, tête immobile…';
  const loop=async()=>{ if(!cam.on) return; if(v.readyState>=2){ try{ await cam.fm.send({image:v}); }catch(e){} } requestAnimationFrame(loop); }; loop();
}
function stopCam(){ cam.on=false; cam.stream?.getTracks().forEach(t=>t.stop()); $('#cam').hidden=true; renderTop(); }
$('#recal').onclick=()=>{ cam.base=null; cam.calib=[]; $('#camMsg').textContent='Calibration…'; };
function onFace(r){
  const lm=r.multiFaceLandmarks?.[0]; if(!lm){ $('#camMsg').textContent='Visage non détecté'; return; }
  const asp=(r.image?.width||4)/(r.image?.height||3), n=lm[1], L=lm[33], R=lm[263];
  const lx=L.x*asp, rx=R.x*asp, nx=n.x*asp, ed=Math.hypot(rx-lx,R.y-L.y), mx=(lx+rx)/2, my=(L.y+R.y)/2;
  const roll=Math.atan2(R.y-L.y,rx-lx), c=Math.cos(-roll), s=Math.sin(-roll), vx=nx-mx, vy=n.y-my;
  const yaw=(vx*c-vy*s)/ed, pitch=(vx*s+vy*c)/ed;
  if(!cam.base){ cam.calib.push([yaw,pitch,roll]); if(cam.calib.length>=25){ const m=i=>cam.calib.reduce((a,v)=>a+v[i],0)/cam.calib.length; cam.base={y:m(0),p:m(1),r:m(2)}; $('#camMsg').textContent='Prêt'; } return; }
  const k=S.settings.sens, kP=.12*k, kY=.16*k, kR=.26*k;
  const dp=pitch-cam.base.p, dy=yaw-cam.base.y, dr=roll-cam.base.r, now=performance.now();
  $('#mP').style.width=Math.min(100,Math.abs(dp)/kP*100)+'%'; $('#mY').style.width=Math.min(100,Math.abs(dy)/kY*100)+'%'; $('#mR').style.width=Math.min(100,Math.abs(dr)/kR*100)+'%';
  if(now<cam.cool){ cam.exc=null; return; }
  if(Math.abs(dr)>kR){ if(!cam.rollT) cam.rollT=now; if(now-cam.rollT>1000){ fire('parler'); cam.rollT=0; cam.cool=now+2000; } return; } else cam.rollT=0;
  if(!cam.exc){
    if(Math.abs(dp)>kP && Math.abs(dp)/kP>=Math.abs(dy)/kY) cam.exc={ax:'p',t:now,pp:0,py:0};
    else if(Math.abs(dy)>kY) cam.exc={ax:'y',t:now,pp:0,py:0};
    else if(Math.abs(dp)<kP*.3 && Math.abs(dy)<kY*.3){ cam.base.p+=.02*dp; cam.base.y+=.02*dy; cam.base.r+=.02*dr; }
  }
  if(cam.exc){
    const e=cam.exc; e.pp=Math.max(e.pp,Math.abs(dp)/kP); e.py=Math.max(e.py,Math.abs(dy)/kY);
    if(now-e.t>1600){ cam.exc=null; if(now-e.t>4000) cam.base=null; }
    else if(Math.abs(dp)<kP*.45 && Math.abs(dy)<kY*.45){
      cam.exc=null;
      if(e.ax==='p' && e.pp>e.py*1.15){ fire('oui'); cam.cool=now+1200; }
      else if(e.ax==='y' && e.py>e.pp*1.15){ fire('non'); cam.cool=now+1200; }
    }
  }
}
function fire(a){ $('#camLast').textContent=({oui:'Oui',non:'Non',parler:'Parler'}[a]); answer(a); }
